<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spaced review · Jackpot Statistical</title>
<meta name="description" content="Spaced repetition review of what you learned.">
<link rel="stylesheet" href="../../assets/css/main.css">
<link rel="stylesheet" href="../../assets/css/lesson.css">
<script>window.SITE_BASE="../../";window.SITE_LANG="en";</script>
</head>
<body>
<header class="site-nav">
  <a class="brand" href="../../en/"><span class="brand-chip">♠</span> Jackpot Statistical</a>
  <nav class="nav-links"><a class="btn btn-ghost btn-sm" href="../../en/lab/">🔬 Lab</a><a class="btn btn-ghost btn-sm" href="../../en/glosario/">∑ Symbols</a><div id="progress-chip" class="progress-chip"></div></nav>
</header>
<main class="container" style="padding-top:24px">
  <h1>🧠 Spaced review</h1>
  <p class="lead">Questions you should review today according to your spaced-repetition calendar (Leitner boxes).</p>
  <div id="review-status" class="block"></div>
  <div id="review-quiz" class="block"></div>
</main>
<footer class="site-foot"><p>Jackpot Statistical</p><p class="fineprint">Course designed by Prof. Alejandro Quintero Ruiz (<a href="https://www.linkedin.com/in/alejandroquinteroruiz/" target="_blank" rel="noopener">LinkedIn</a>).</p></footer>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/progress.js"></script>
<script src="../../assets/js/charts.js"></script>
<script src="../../assets/js/gamification.js"></script>
<script src="../../assets/js/quiz.js"></script>
<script src="../../assets/js/diploma.js"></script>
<script src="../../assets/js/symbols.js"></script>
<script src="../../assets/js/casino-bg.js"></script>
<script src="../../exercises-index.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const status=document.getElementById("review-status");
  const quiz=document.getElementById("review-quiz");
  const due=window.Progress.dueSrs();
  const items=due.map(id=>window.EXERCISES && window.EXERCISES[id]).filter(Boolean);
  if(items.length===0){
    status.innerHTML="<p class='score-line'>No pending reviews today! Come back tomorrow or complete more lessons.</p>";
    return;
  }
  status.innerHTML="<p class='score-line'>You have <strong>"+items.length+"</strong> question(s) to review today.</p>";
  window.Quiz.render(quiz, items);
});
</script>
</body>
</html>
